# ============================================================
# CONFIGURACIÓN DEL SISTEMA CONTROL INSTRUCTORES SENA (BACKEND)
# ============================================================

server.port=8080
server.servlet.context-path=

# Configuración Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/controlsystem_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Carga de archivos Excel (SOFIA Plus hasta 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.sena.controlsystem=INFO
logging.level.org.springframework.web=INFO

